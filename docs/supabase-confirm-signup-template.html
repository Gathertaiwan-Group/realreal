<!--
  Supabase Auth → Confirm signup 範本
  貼到：Supabase Dashboard → Authentication → Email Templates → Confirm signup

  重點（2026-08-30 加入）：按鈕下方多了一行「完整純文字網址」。
  某些手機郵件 App（實際案例：iPhone 上的 Gmail App）會把 <a> 標籤降級成
  純文字，客人只看得到「確認註冊」四個字卻點不下去。附上可複製的網址後，
  就算連結樣式被吃掉，客人仍然可以自己複製貼到瀏覽器完成註冊。

  Subject 欄位建議填：【誠真生活】確認您的註冊
-->
<div style="font-family:-apple-system,'Segoe UI',sans-serif;max-width:600px;margin:0 auto;padding:24px;color:#1a1a1a">

  <h1 style="color:#10305a;border-bottom:2px solid #10305a;padding-bottom:8px;font-size:22px;margin:0 0 24px">
    誠真生活 RealReal
  </h1>

  <h2 style="font-size:18px;margin:0 0 12px">確認您的註冊</h2>

  <p style="line-height:1.7;margin:0 0 24px">
    感謝您加入誠真生活！請點擊下方按鈕完成註冊，即可開始累積公益存款點數。
  </p>

  <p style="margin:0 0 24px">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=signup&next=/"
       style="display:inline-block;background:#10305a;color:#ffffff;text-decoration:none;padding:12px 28px;border-radius:8px;font-size:16px;font-weight:600">
      確認註冊
    </a>
  </p>

  <div style="background:#f5f8fc;border:1px solid #dbe6f3;border-radius:8px;padding:16px;margin:0 0 24px">
    <p style="margin:0 0 8px;font-size:14px;color:#687279">
      按鈕無法點擊嗎？請複製下方完整網址，貼到瀏覽器開啟：
    </p>
    <p style="margin:0;font-size:13px;line-height:1.6;word-break:break-all;color:#10305a">
      {{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=signup&next=/
    </p>
  </div>

  <p style="font-size:14px;color:#687279;line-height:1.7;margin:0 0 24px">
    若您並未註冊誠真生活會員，請忽略這封信，您的信箱不會被建立任何帳號。
  </p>

  <hr style="margin:24px 0;border:none;border-top:1px solid #eee">

  <p style="font-size:13px;color:#555;line-height:2;margin:0">
    誠真生活 | <a href="https://realreal.cc" style="color:#10305a">realreal.cc</a><br>
    Email: <a href="mailto:love@realreal.cc" style="color:#10305a">love@realreal.cc</a><br>
    Line 真人客服: @900kevgi
  </p>

</div>
