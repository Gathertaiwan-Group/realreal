# Deployed from the monorepo ROOT (not apps/api), so commands are root-relative.
# One config serves both the API service and the worker service; they differ
# only by the APP_ENTRYPOINT env var (unset -> index; "worker" -> worker).
[build]
builder = "NIXPACKS"
# The service sets NODE_ENV=production, which npm injects into the build and
# makes EVERY install default to omit=dev — so @types/* (lockfile dev:true)
# never get installed and tsc fails with TS7016. `--include=dev` overrides
# that. Must be `npm install`, not `npm ci`: Railway mounts a build cache at
# node_modules/.cache, and npm ci dies trying to rmdir it (EBUSY).
buildCommand = "npm install --include=dev && npx turbo build --filter=api"

[deploy]
startCommand = "node apps/api/dist/${APP_ENTRYPOINT:-index}.js"
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
