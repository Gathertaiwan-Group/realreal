# Deployed from the monorepo ROOT (not apps/api), so commands are root-relative.
# One config serves both the API service and the worker service; they differ
# only by the APP_ENTRYPOINT env var (unset -> index; "worker" -> worker).
[build]
builder = "NIXPACKS"
# Build must NOT touch node_modules: nixpacks' install phase already ran
# `npm ci` (full tree incl. workspace devDeps). Re-running `npm install
# --workspaces` here prunes @types/* (TS7016 on fresh builds), and `npm ci`
# can't rmdir node_modules/.cache because Railway mounts a build cache there
# (EBUSY). Just compile.
buildCommand = "npx turbo build --filter=api"

[deploy]
startCommand = "node apps/api/dist/${APP_ENTRYPOINT:-index}.js"
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
